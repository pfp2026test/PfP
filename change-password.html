<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password — Pins for Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121214; --green:#007A3D; --red:#CE1126;
    --glass-border: rgba(255,255,255,0.09);
    --glass-bg: rgba(255,255,255,0.03);
    --text-dim: rgba(235,235,238,0.62);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg); color:#f2f2f3; font-family:'Plus Jakarta Sans', sans-serif;
    display:flex; align-items:center; justify-content:center; position:relative;
    -webkit-font-smoothing:antialiased;
  }
  .glow{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;}
  .glow-green{width:46vw;height:46vw;top:-14vw;left:-12vw;background:radial-gradient(circle, rgba(0,122,61,0.32) 0%, rgba(0,122,61,0) 70%);}
  .glow-red{width:50vw;height:50vw;bottom:-18vw;right:-14vw;background:radial-gradient(circle, rgba(206,17,38,0.26) 0%, rgba(206,17,38,0) 70%);}

  .card{
    position:relative; z-index:2; width:100%; max-width:420px; padding:40px 36px;
    border-radius:16px; background:var(--glass-bg); border:1px solid var(--glass-border);
    backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 20px 60px rgba(0,0,0,0.45); margin:20px;
  }
  .badge{
    display:inline-flex; align-items:center; gap:8px; padding:6px 14px; margin-bottom:20px;
    border-radius:999px; background:rgba(0,122,61,0.12); border:1px solid rgba(0,122,61,0.35);
    font-size:12px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:#4fce8a;
  }
  h1{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:22px; margin-bottom:6px; }
  .sub{ font-size:13.5px; color:var(--text-dim); margin-bottom:26px; line-height:1.6; }
  label{ display:block; font-size:12.5px; font-weight:500; letter-spacing:0.03em; text-transform:uppercase; color:var(--text-dim); margin-bottom:8px; }
  .field{ margin-bottom:18px; }
  input{
    width:100%; padding:12px 14px; border-radius:8px; background:rgba(255,255,255,0.04);
    border:1px solid var(--glass-border); color:#f2f2f3; font-family:'Plus Jakarta Sans', sans-serif;
    font-size:14.5px; outline:none; transition:border-color .18s ease, background .18s ease;
  }
  input::placeholder{ color:rgba(235,235,238,0.32); }
  input:focus{ border-color:rgba(0,122,61,0.6); background:rgba(255,255,255,0.06); box-shadow:0 0 0 3px rgba(0,122,61,0.15); }
  .hint{ font-size:12px; color:var(--text-dim); margin-top:6px; line-height:1.5; }
  button{
    width:100%; margin-top:6px; padding:12px 18px; border-radius:8px; border:1px solid rgba(255,255,255,0.14);
    background:linear-gradient(135deg, #E31730 0%, var(--red) 55%, #A50E1F 100%); color:#fff;
    font-family:'Plus Jakarta Sans', sans-serif; font-size:14.5px; font-weight:600; letter-spacing:0.02em;
    cursor:pointer; box-shadow:0 4px 18px rgba(206,17,38,0.3); transition:transform .18s ease, box-shadow .18s ease;
  }
  button:hover{ transform:translateY(-1px); box-shadow:0 6px 24px rgba(206,17,38,0.45); }
  button:disabled{ opacity:0.6; cursor:not-allowed; transform:none; }
  .error{
    display:none; margin-bottom:18px; padding:10px 14px; border-radius:8px;
    background:rgba(206,17,38,0.1); border:1px solid rgba(206,17,38,0.35); color:#ff9aa5;
    font-size:13px; line-height:1.5;
  }
  .error.visible{ display:block; }
</style>
</head>
<body>
  <div class="glow glow-green"></div>
  <div class="glow glow-red"></div>

  <div class="card">
    <div class="badge">Action required</div>
    <h1>Set a new password</h1>
    <p class="sub">This is your first sign-in, or your password was reset. Choose a new password to continue to your dashboard.</p>

    <div class="error" id="errorBox"></div>

    <form id="changeForm">
      <div class="field">
        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password" minlength="10" required>
        <p class="hint">At least 10 characters. Avoid reusing the current password.</p>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" minlength="10" required>
      </div>
      <button type="submit" id="submitBtn">Update Password</button>
    </form>
  </div>

  <script>
    const errorBox = document.getElementById('errorBox');
    function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('visible'); }

    // Confirm the visitor actually has a valid session before letting them try.
    (async () => {
      try {
        const res = await fetch('/api/session');
        if (!res.ok) { window.location.href = '/employee-login.html'; }
      } catch {
        window.location.href = '/employee-login.html';
      }
    })();

    document.getElementById('changeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('visible');

      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        showError('New password and confirmation do not match.');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating…';

      try {
        const res = await fetch('/api/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword, newPassword }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Something went wrong. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
          return;
        }

        window.location.href = '/dashboard.html';
      } catch (err) {
        showError('Could not reach the server. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
