<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meetings — Pins for Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell.css">
<style>
  .content-inner{ position:relative; z-index:2; max-width:820px; margin:0 auto; padding:56px 32px; }
  .eyebrow{ font-size:12.5px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:var(--text-dim); margin-bottom:14px; }
  h1{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:clamp(1.8rem, 4vw, 2.4rem); letter-spacing:-0.01em; margin-bottom:24px; }
  .panel{ border-radius:16px; background:var(--glass-bg); border:1px solid var(--glass-border); padding:28px; }
  .top-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .sub{ font-size:13.5px; color:var(--text-dim); }
  .add-btn{
    padding:10px 20px; border-radius:8px; border:1px solid rgba(255,255,255,0.14);
    background:linear-gradient(135deg, #E31730 0%, var(--red) 55%, #A50E1F 100%); color:#fff;
    font-family:'Plus Jakarta Sans', sans-serif; font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .join-btn{
    padding:8px 16px; border-radius:8px; border:1px solid rgba(0,122,61,0.4);
    background:rgba(0,122,61,0.15); color:#4fce8a; font-family:'Plus Jakarta Sans', sans-serif;
    font-size:13px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block;
  }
  .join-btn:hover{ background:rgba(0,122,61,0.25); }
  .del-btn{
    font-size:12px; font-weight:600; color:#ff9aa5; background:rgba(206,17,38,0.08);
    border:1px solid rgba(206,17,38,0.3); border-radius:6px; padding:6px 12px; cursor:pointer; margin-left:8px;
  }
  .del-btn:hover{ background:rgba(206,17,38,0.18); }

  .meeting-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 4px;
    border-bottom:1px solid rgba(255,255,255,0.04);
  }
  .meeting-row:last-child{ border-bottom:none; }
  .meeting-title{ font-size:14px; font-weight:600; margin-bottom:3px; }
  .meeting-meta{ font-size:12px; color:var(--text-dim); }

  .msg{ margin-top:14px; padding:10px 14px; border-radius:8px; font-size:13px; line-height:1.5; display:none; }
  .msg.visible{ display:block; }
  .msg-error{ background:rgba(206,17,38,0.1); border:1px solid rgba(206,17,38,0.35); color:#ff9aa5; }

  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:20; align-items:center; justify-content:center; }
  .modal-overlay.visible{ display:flex; }
  .modal{ width:100%; max-width:340px; margin:20px; padding:24px; border-radius:14px; background:#1a1a1d; border:1px solid var(--glass-border); }
  .modal h3{ font-family:'Space Grotesk', sans-serif; font-size:16px; margin-bottom:14px; }
  .modal input[type="text"]{
    width:100%; padding:9px 11px; border-radius:8px; background:rgba(255,255,255,0.04);
    border:1px solid var(--glass-border); color:#f2f2f3; font-size:13.5px; margin-bottom:16px; outline:none;
  }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; }
  .modal-actions button{ padding:8px 16px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--glass-border); }
  .modal-cancel{ background:transparent; color:var(--text-dim); }
  .modal-create{ background:linear-gradient(135deg, #E31730, var(--red)); color:#fff; border-color:rgba(255,255,255,0.14); }
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon"></div>
        <span class="brand-title">Pins for Palestine</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html"><span>Dashboard</span></a>
        <a href="/tasks.html"><span>My Tasks</span></a>
        <a href="/chat.html"><span>Team Chat</span></a>
        <a href="/meetings.html"><span>Meetings</span></a>
        <a href="/mail.html"><span>Mail</span></a>
        <a href="/users.html" id="navUserMgmt" style="display:none;"><span>User Management</span></a>
        <div class="nav-divider"></div>
        <a href="#" class="disabled-link"><span>Pin Requests</span><span class="soon-badge">Soon</span></a>
        <a href="#" class="disabled-link"><span>Inventory</span><span class="soon-badge">Soon</span></a>
        <a href="#" class="disabled-link"><span>Campaign Impact</span><span class="soon-badge">Soon</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-username" id="sidebarUsername">Loading…</div>
        <button id="logoutBtn">Log Out</button>
      </div>
    </aside>

    <main class="content-area">
      <div class="glow glow-green"></div>
      <div class="glow glow-red"></div>
      <div class="content-inner">
        <p class="eyebrow">Internal</p>
        <h1>Meetings</h1>

        <div class="panel">
          <div class="top-row">
            <p class="sub" id="meetingsSub">Loading…</p>
            <button class="add-btn" id="newMeetingBtn" style="display:none;">+ New Meeting</button>
          </div>
          <div id="meetingsList"></div>
          <div class="msg" id="meetingsMsg"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Start a Meeting</h3>
      <input type="text" id="meetingTitleInput" placeholder="Meeting title (e.g. Weekly Sync)">
      <div class="modal-actions">
        <button class="modal-cancel" id="modalCancelBtn">Cancel</button>
        <button class="modal-create" id="modalCreateBtn">Create</button>
      </div>
    </div>
  </div>

  <script src="/assets/shell.js"></script>
  <script>
    let isAdmin = false;

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function timeAgo(iso) {
      const d = new Date(iso + 'Z');
      return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    async function loadMeetings() {
      const sub = document.getElementById('meetingsSub');
      const listEl = document.getElementById('meetingsList');
      try {
        const res = await fetch('/api/meetings/list');
        const data = await res.json();
        if (!res.ok) {
          sub.textContent = data.error || 'Could not load meetings.';
          return;
        }
        if (data.meetings.length === 0) {
          sub.textContent = 'No active meetings right now.';
          listEl.innerHTML = '';
          return;
        }
        sub.textContent = data.meetings.length + ' active meeting' + (data.meetings.length === 1 ? '' : 's') + '.';
        listEl.innerHTML = data.meetings.map(m => {
          const delBtn = isAdmin
            ? '<button class="del-btn" data-id="' + m.id + '" data-title="' + escapeHtml(m.title) + '">End</button>'
            : '';
          return '<div class="meeting-row">' +
            '<div><div class="meeting-title">' + escapeHtml(m.title) + '</div>' +
            '<div class="meeting-meta">Started by ' + escapeHtml(m.created_by_username) + ' · ' + timeAgo(m.created_at) + '</div></div>' +
            '<div><a class="join-btn" href="/meeting.html?room=' + encodeURIComponent(m.room_url) + '&title=' + encodeURIComponent(m.title) + '">Join</a>' + delBtn + '</div>' +
          '</div>';
        }).join('');

        listEl.querySelectorAll('.del-btn').forEach(btn => {
          btn.addEventListener('click', () => endMeeting(btn.dataset.id, btn.dataset.title));
        });
      } catch {
        sub.textContent = 'Could not reach the server.';
      }
    }

    async function endMeeting(id, title) {
      if (!confirm('End the meeting "' + title + '"? Everyone will be disconnected.')) return;
      try {
        const res = await fetch('/api/meetings/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ meetingId: Number(id) }),
        });
        const data = await res.json();
        if (!res.ok) { alert(data.error || 'Could not end meeting.'); return; }
        loadMeetings();
      } catch {
        alert('Could not reach the server.');
      }
    }

    document.getElementById('newMeetingBtn').addEventListener('click', () => {
      document.getElementById('modalOverlay').classList.add('visible');
    });
    document.getElementById('modalCancelBtn').addEventListener('click', () => {
      document.getElementById('modalOverlay').classList.remove('visible');
    });
    document.getElementById('modalCreateBtn').addEventListener('click', async () => {
      const msg = document.getElementById('meetingsMsg');
      msg.className = 'msg';
      const title = document.getElementById('meetingTitleInput').value.trim();
      try {
        const res = await fetch('/api/meetings/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title }),
        });
        const data = await res.json();
        if (!res.ok) {
          msg.textContent = data.error || 'Could not create meeting.';
          msg.className = 'msg msg-error visible';
          return;
        }
        document.getElementById('modalOverlay').classList.remove('visible');
        document.getElementById('meetingTitleInput').value = '';
        loadMeetings();
      } catch {
        msg.textContent = 'Could not reach the server.';
        msg.className = 'msg msg-error visible';
      }
    });

    document.addEventListener('pfp-session-ready', (e) => {
      isAdmin = !!e.detail.isAdmin;
      if (isAdmin) document.getElementById('newMeetingBtn').style.display = 'inline-block';
      loadMeetings();
      setInterval(loadMeetings, 10000);
    });
  </script>
</body>
</html>
