<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management — Pins for Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell.css">
<style>
  .content-inner{ position:relative; z-index:2; max-width:820px; margin:0 auto; padding:56px 32px; }
  .eyebrow{ font-size:12.5px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:var(--text-dim); margin-bottom:14px; }
  h1{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:clamp(1.8rem, 4vw, 2.4rem); letter-spacing:-0.01em; margin-bottom:24px; }

  .panel{ border-radius:16px; background:var(--glass-bg); border:1px solid var(--glass-border); padding:28px; }
  .sub{ font-size:13.5px; color:var(--text-dim); margin-bottom:24px; }

  table{ width:100%; border-collapse:collapse; margin-bottom:26px; }
  th{ text-align:left; font-size:11.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); padding:0 12px 10px; border-bottom:1px solid var(--glass-border); }
  td{ padding:12px; border-bottom:1px solid rgba(255,255,255,0.04); font-size:13.5px; vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }

  .badge{ display:inline-block; font-size:11px; font-weight:600; letter-spacing:0.03em; padding:3px 9px; border-radius:999px; text-transform:uppercase; }
  .badge-admin{ background:rgba(0,122,61,0.15); color:#4fce8a; border:1px solid rgba(0,122,61,0.35); }
  .badge-pending{ background:rgba(206,17,38,0.12); color:#ff9aa5; border:1px solid rgba(206,17,38,0.3); }

  .del-btn{ font-size:12px; font-weight:600; color:#ff9aa5; background:rgba(206,17,38,0.08); border:1px solid rgba(206,17,38,0.3); border-radius:6px; padding:6px 12px; cursor:pointer; }
  .del-btn:hover{ background:rgba(206,17,38,0.18); }
  .del-btn:disabled{ opacity:0.35; cursor:not-allowed; }

  .add-form{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .add-form .field{ flex:1; min-width:180px; }
  .add-form label{ display:block; font-size:12px; font-weight:500; letter-spacing:0.03em; text-transform:uppercase; color:var(--text-dim); margin-bottom:7px; }
  .add-form input[type="text"]{
    width:100%; padding:10px 12px; border-radius:8px; background:rgba(255,255,255,0.04);
    border:1px solid var(--glass-border); color:#f2f2f3; font-family:'Plus Jakarta Sans', sans-serif; font-size:14px; outline:none;
  }
  .add-form input[type="text"]:focus{ border-color:rgba(0,122,61,0.6); }
  .checkbox-field{ display:flex; align-items:center; gap:8px; padding-bottom:10px; white-space:nowrap; }
  .checkbox-field label{ font-size:13px; color:var(--text-dim); text-transform:none; letter-spacing:0; margin:0; }

  .add-btn{
    padding:10px 20px; border-radius:8px; border:1px solid rgba(255,255,255,0.14);
    background:linear-gradient(135deg, #E31730 0%, var(--red) 55%, #A50E1F 100%); color:#fff;
    font-family:'Plus Jakarta Sans', sans-serif; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .add-btn:disabled{ opacity:0.6; cursor:not-allowed; }

  .msg{ margin-top:14px; padding:10px 14px; border-radius:8px; font-size:13px; line-height:1.5; display:none; }
  .msg.visible{ display:block; }
  .msg-error{ background:rgba(206,17,38,0.1); border:1px solid rgba(206,17,38,0.35); color:#ff9aa5; }
  .msg-success{ background:rgba(0,122,61,0.1); border:1px solid rgba(0,122,61,0.35); color:#8be3af; }
  .msg-success code{ display:block; margin-top:8px; padding:8px 10px; background:rgba(0,0,0,0.3); border-radius:6px; font-size:14px; letter-spacing:0.03em; user-select:all; }

  .no-access{ color:var(--text-dim); font-size:14px; }
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon"></div>
        <span class="brand-title">Pins for Palestine</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html"><span>Dashboard</span></a>
        <a href="/tasks.html"><span>My Tasks</span></a>
        <a href="/chat.html"><span>Team Chat</span></a>
        <a href="/meetings.html"><span>Meetings</span></a>
        <a href="/mail.html"><span>Mail</span></a>
        <a href="/users.html" id="navUserMgmt" style="display:none;"><span>User Management</span></a>
        <div class="nav-divider"></div>
        <a href="#" class="disabled-link"><span>Pin Requests</span><span class="soon-badge">Soon</span></a>
        <a href="#" class="disabled-link"><span>Inventory</span><span class="soon-badge">Soon</span></a>
        <a href="#" class="disabled-link"><span>Campaign Impact</span><span class="soon-badge">Soon</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-username" id="sidebarUsername">Loading…</div>
        <button id="logoutBtn">Log Out</button>
      </div>
    </aside>

    <main class="content-area">
      <div class="glow glow-green"></div>
      <div class="glow glow-red"></div>
      <div class="content-inner">
        <p class="eyebrow">Internal</p>
        <h1>User Management</h1>
        <div id="pageBody">
          <p class="no-access">Checking access…</p>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/shell.js"></script>
  <script>
    let currentUserId = null;

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderPanel() {
      document.getElementById('pageBody').innerHTML =
        '<div class="panel">' +
          '<p class="sub">Add employee accounts and remove access when needed.</p>' +
          '<table id="usersTable">' +
            '<thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Added</th><th></th></tr></thead>' +
            '<tbody id="usersTbody"><tr><td colspan="5" style="color:var(--text-dim);">Loading…</td></tr></tbody>' +
          '</table>' +
          '<form id="addUserForm" class="add-form">' +
            '<div class="field"><label for="newUsername">New employee username</label><input type="text" id="newUsername" placeholder="e.g. jsmith" required></div>' +
            '<div class="checkbox-field"><input type="checkbox" id="newIsAdmin"><label for="newIsAdmin">Grant admin access</label></div>' +
            '<button type="submit" class="add-btn" id="addUserBtn">Add Employee</button>' +
          '</form>' +
          '<div class="msg" id="addUserMsg"></div>' +
        '</div>';

      document.getElementById('addUserForm').addEventListener('submit', onAddUser);
      loadUsers();
    }

    async function loadUsers() {
      const tbody = document.getElementById('usersTbody');
      try {
        const res = await fetch('/api/admin/list-users');
        const data = await res.json();
        if (!res.ok) {
          tbody.innerHTML = '<tr><td colspan="5" style="color:#ff9aa5;">' + escapeHtml(data.error || 'Could not load users.') + '</td></tr>';
          return;
        }
        if (data.users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="color:var(--text-dim);">No users yet.</td></tr>';
          return;
        }
        tbody.innerHTML = data.users.map(u => {
          const isSelf = u.id === currentUserId;
          const roleBadge = u.is_admin ? '<span class="badge badge-admin">Admin</span>' : 'Employee';
          const statusBadge = u.must_change_password ? '<span class="badge badge-pending">Pending setup</span>' : 'Active';
          const dateStr = new Date(u.created_at + 'Z').toLocaleDateString();
          const delDisabled = isSelf ? 'disabled title="You can\'t delete your own account"' : '';
          return '<tr><td>' + escapeHtml(u.username) + (isSelf ? ' <span style="color:var(--text-dim);">(you)</span>' : '') + '</td>' +
            '<td>' + roleBadge + '</td><td>' + statusBadge + '</td>' +
            '<td style="color:var(--text-dim);">' + dateStr + '</td>' +
            '<td><button class="del-btn" data-id="' + u.id + '" data-username="' + escapeHtml(u.username) + '" ' + delDisabled + '>Delete</button></td></tr>';
        }).join('');

        tbody.querySelectorAll('.del-btn').forEach(btn => {
          btn.addEventListener('click', () => deleteUser(btn.dataset.id, btn.dataset.username));
        });
      } catch {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#ff9aa5;">Could not reach the server.</td></tr>';
      }
    }

    async function deleteUser(userId, username) {
      if (!confirm('Delete the account "' + username + '"? This can\'t be undone.')) return;
      try {
        const res = await fetch('/api/admin/delete-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: Number(userId) }),
        });
        const data = await res.json();
        if (!res.ok) { alert(data.error || 'Could not delete user.'); return; }
        loadUsers();
      } catch {
        alert('Could not reach the server.');
      }
    }

    async function onAddUser(e) {
      e.preventDefault();
      const msg = document.getElementById('addUserMsg');
      msg.className = 'msg';
      const btn = document.getElementById('addUserBtn');
      const username = document.getElementById('newUsername').value.trim();
      const isAdmin = document.getElementById('newIsAdmin').checked;

      btn.disabled = true;
      btn.textContent = 'Adding…';

      try {
        const res = await fetch('/api/admin/create-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, isAdmin }),
        });
        const data = await res.json();

        if (!res.ok) {
          msg.textContent = data.error || 'Could not create user.';
          msg.className = 'msg msg-error visible';
          btn.disabled = false;
          btn.textContent = 'Add Employee';
          return;
        }

        msg.innerHTML = 'Account created for <strong>' + escapeHtml(data.username) + '</strong>. Share this temporary password with them now — it won\'t be shown again:<code>' + escapeHtml(data.tempPassword) + '</code>';
        msg.className = 'msg msg-success visible';
        document.getElementById('newUsername').value = '';
        document.getElementById('newIsAdmin').checked = false;
        loadUsers();
      } catch {
        msg.textContent = 'Could not reach the server.';
        msg.className = 'msg msg-error visible';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Add Employee';
      }
    }

    document.addEventListener('pfp-session-ready', async (e) => {
      if (!e.detail.isAdmin) {
        document.getElementById('pageBody').innerHTML = '<p class="no-access">You need admin access to view this page.</p>';
        return;
      }
      renderPanel();
      try {
        const listRes = await fetch('/api/admin/list-users');
        if (listRes.ok) {
          const listData = await listRes.json();
          const me = listData.users.find(u => u.username === e.detail.username);
          if (me) currentUserId = me.id;
        }
      } catch {}
    });
  </script>
</body>
</html>
