<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting — Pins for Palestine</title>
<script src="https://cdn.srv.whereby.com/embed/v2-embed.js" type="module"></script>
<style>
  :root{ --bg:#121214; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; width:100%; overflow:hidden; }
  body{ background:var(--bg); font-family:'Plus Jakarta Sans', sans-serif; }

  whereby-embed{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }

  .error-box{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#ff9aa5; font-size:14px; padding:20px; text-align:center; background:var(--bg);
  }
</style>
</head>
<body>
  <div id="callContainer">
    <div class="error-box">Loading meeting…</div>
  </div>

  <script>
    (async () => {
      try {
        const res = await fetch('/api/session');
        if (!res.ok) { window.location.href = '/employee-login.html'; return; }
        const data = await res.json();
        if (data.mustChangePassword) { window.location.href = '/change-password.html'; return; }
      } catch {
        window.location.href = '/employee-login.html';
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const room = params.get('room');

      const container = document.getElementById('callContainer');
      if (!room) {
        container.innerHTML = '<div class="error-box">No meeting room specified.</div>';
        return;
      }

      container.innerHTML = '';
      const embed = document.createElement('whereby-embed');
      embed.setAttribute('room', room);
      container.appendChild(embed);

      embed.addEventListener('leave', () => {
        window.location.href = '/meetings.html';
      });
    })();
  </script>
</body>
</html>
