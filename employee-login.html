<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Login — Pins for Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121214;
    --green:#007A3D;
    --red:#CE1126;
    --glass-border: rgba(255,255,255,0.09);
    --glass-bg: rgba(255,255,255,0.03);
    --text-dim: rgba(235,235,238,0.62);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:var(--bg);
    color:#f2f2f3;
    font-family:'Plus Jakarta Sans', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* Ambient glows */
  .glow{
    position:fixed;
    border-radius:50%;
    filter:blur(120px);
    pointer-events:none;
    z-index:0;
  }
  .glow-green{
    width:46vw;height:46vw;
    top:-14vw; left:-12vw;
    background:radial-gradient(circle, rgba(0,122,61,0.28) 0%, rgba(0,122,61,0) 70%);
  }
  .glow-red{
    width:50vw;height:50vw;
    bottom:-18vw; right:-14vw;
    background:radial-gradient(circle, rgba(206,17,38,0.20) 0%, rgba(206,17,38,0) 70%);
  }

  /* Login Container */
  .login-container{
    position:relative;
    z-index:2;
    width:100%;
    max-width:420px;
    padding:24px;
  }

  .login-card{
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(20px);
    border-radius:20px;
    padding:40px;
    box-shadow:0 24px 48px rgba(0,0,0,0.6);
  }

  .brand-header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:28px;
  }

  .brand-icon{
    width:34px;
    height:34px;
    border-radius:10px;
    background:linear-gradient(135deg, var(--green) 0%, var(--green) 45%, #ffffff 50%, var(--red) 55%, var(--red) 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,0.12) inset;
  }

  .brand-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.12em;
    text-transform:uppercase;
  }

  .headline{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:1.8rem;
    letter-spacing:-0.02em;
    text-transform:uppercase;
    background:linear-gradient(100deg, var(--green) 0%, #6fd39a 22%, #ffffff 50%, #f08a95 78%, var(--red) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:8px;
  }

  .subtext{
    color:var(--text-dim);
    font-size:14px;
    margin-bottom:28px;
  }

  .form-group{
    margin-bottom:18px;
  }

  .form-group label{
    display:block;
    font-size:12px;
    font-weight:500;
    color:var(--text-dim);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }

  .form-control{
    width:100%;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--glass-border);
    border-radius:10px;
    padding:12px 14px;
    color:#fff;
    font-size:14px;
    font-family:'Plus Jakarta Sans', sans-serif;
    outline:none;
    transition:border-color .2s ease, background .2s ease;
  }

  .form-control:focus{
    border-color:rgba(255,255,255,0.3);
    background:rgba(255,255,255,0.07);
  }

  .btn{
    width:100%;
    background:linear-gradient(135deg, #E31730 0%, var(--red) 55%, #A50E1F 100%);
    color:#fff;
    border:none;
    padding:13px;
    border-radius:10px;
    font-family:'Plus Jakarta Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    margin-top:8px;
    transition:opacity .2s ease, transform .2s ease;
    box-shadow:0 4px 16px rgba(206,17,38,0.3);
  }

  .btn:hover{
    opacity:0.92;
    transform:translateY(-1px);
  }

  .error-msg{
    color: #f08a95;
    font-size: 13px;
    margin-top: 14px;
    text-align: center;
    display: none;
  }
</style>
</head>
<body>

  <div class="glow glow-green"></div>
  <div class="glow glow-red"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-icon"></div>
        <span class="brand-title">Pins for Palestine</span>
      </div>

      <h1 class="headline">Employee Login</h1>
      <p class="subtext">Enter your credentials to access the secure staff portal.</p>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter username" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn">Sign In</button>
        <div id="errorMsg" class="error-msg">Invalid username or password.</div>
      </form>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMsg');

      // Check against default admin or any users created in User Management
      const savedUsers = JSON.parse(localStorage.getItem('pfp_users') || '["pfpadmin"]');
      
      // Simple verification (allowing default or created users with any valid credential submission)
      if (savedUsers.includes(user)) {
        // Mark session as successfully authenticated
        localStorage.setItem('pfp_logged_in', 'true');
        localStorage.removeItem('pfp_needs_change');
        
        // Redirect to dashboard hub
        window.location.href = 'dashboard.html';
      } else {
        errorEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
